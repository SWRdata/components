name: 'deploy sophora-components'
on:
  workflow_dispatch:
  push:
    paths:
      - 'sophora-components/**'
    branches:
      - main
  pull_request:
    paths:
      - 'sophora-components/**'
    types: [opened, synchronize]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      BASE_PATH: '/apps/sophora-components/${{ github.head_ref || github.ref_name }}'
      ASSETS_PATH: 'https://static.datenhub.net/apps/sophora-components/${{ github.head_ref || github.ref_name }}'
    defaults:
      run:
        working-directory: ./sophora-components
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18
      - name: Create .env file for production
        run: |
          touch .env
          echo BASE_PATH=$BASE_PATH >> .env
          echo ASSETS_PATH=$ASSETS_PATH >> .env
      - run: npm ci
      - run: npm run build
      - uses: ./.github/actions/gcp-auth
        if: github.actor != 'dependabot[bot]'
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          pool_id: ${{ secrets.GCP_POOL_ID }}
          project_number: ${{ secrets.GCP_PROJECT_NUMBER }}
          wip_sa: ${{ secrets.GCP_WIP_SA }}
      - name: 'Upload files to GCP'
        if: github.actor != 'dependabot[bot]'
        uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a #v3.0.0
        with:
          path: './sophora-components/build'
          parent: false
          destination: 'datenhub-net-static/apps/sophora-components/${{ github.head_ref || github.ref_name }}/'
