name: e2e tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'components/**'
      - 'components-map/**'
      - 'mock-sveltekit/**'
    branches:
      - main
  pull_request:
    paths:
      - 'components/**'
      - 'components-map/**'
      - 'mock-sveltekit/**'
    types: [opened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18
      - run: npm ci --workspace=components --workspace=components-map --workspace=mock-sveltekit --include=dev
      - run: npm run sync --workspace=mock-sveltekit
      - run: npm run build --workspace=mock-sveltekit
      - run: npx playwright install --with-deps chromium
      - run: npm test --workspace=mock-sveltekit
