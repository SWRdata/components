name: 'deploy map icons'
on:
  workflow_dispatch:
  push:
    paths:
      - components/src/maplibre/MapStyle/sprite/**
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/src/maplibre/MapStyle
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: cargo install spreet
      - run: sh make_sprite.sh
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 #v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - name: 'Upload files to GCP'
        uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a #v3.0.0
        with:
          path: '../components/components/src/maplibre/MapStyle/sprite'
          parent: false
          process_gcloudignore: false
          destination: 'datenhub-net-static/maps/styles/swr-datalab-light/sprite'
