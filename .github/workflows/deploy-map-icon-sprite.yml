name: 'deploy map icons'
on:
  workflow_dispatch:
  push:
    paths:
      - components-map/src/MapStyle/sprite/**
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: components-map/src/MapStyle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install spreet
      - run: sh make_sprite.sh
      - uses: ./.github/actions/gcp-auth
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          pool_id: ${{ secrets.GCP_POOL_ID }}
          project_number: ${{ secrets.GCP_PROJECT_NUMBER }}
          wip_sa: ${{ secrets.GCP_WIP_SA }}
      - name: 'Upload files to GCP'
        uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a #v3.0.0
        with:
          path: 'components-map/src/MapStyle/sprite'
          parent: false
          process_gcloudignore: false
          destination: 'datenhub-net-static/maps/styles/swr-datalab-light/sprite'
