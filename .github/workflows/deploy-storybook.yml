name: 'deploy storybook'
on:
  workflow_dispatch:
  push:
    paths:
      - 'components/**'
      - 'components-map/**'
      - 'storybook/**'
    branches:
      - main
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./storybook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18
      - run: npm ci
      - run: npm run build-storybook
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 #v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - name: 'Upload files to GCP'
        uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a #v3.0.0
        with:
          path: './storybook/storybook-static'
          parent: false
          destination: 'datenhub-net-static/apps/${{ github.event.repository.name }}/${{ github.head_ref || github.ref_name }}/'
