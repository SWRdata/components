<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<style>
			@font-face {
				font-family: 'SWR-VAR-Sans';
				font-weight: 400 600 700;
				font-display: swap;
				src: url('https://www.swr.de/assets/fonts/swr_type/SWR_VAR_WEB/SWR-VAR-Sans.woff2')
					format('woff2');
			}

			@font-face {
				font-family: 'SWR-VAR-Text';
				font-weight: 400 600 700;
				font-display: swap;
				src: url('https://www.swr.de/assets/fonts/swr_type/SWR_VAR_WEB/SWR-VAR-Text.woff2')
					format('woff2');
			}
		</style>
	</head>
	<body>
		<div data-lab-components-embed="highlight-cards"></div>
		<script>
			const target = document.currentScript.previousElementSibling;
			if (window.__mountHighlightCards) {
				window.__mountHighlightCards(target);
			} else {
				document.addEventListener('DOMContentLoaded', () => {
					window.__mountHighlightCards(target);
				});
			}
		</script>
		<script type="module">
			import mountEmbed from '/src/lib/utils/mountEmbed';
			import Embed from '/src/components/highlight-cards/embed.svelte';

			window.__mountHighlightCards = (target) => {
				console.log('Mounting Highlight Cards component on', target);
				mountEmbed(target, Embed);
			};
		</script>
	</body>
</html>
