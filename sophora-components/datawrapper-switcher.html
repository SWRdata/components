<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<style>
			@font-face {
				font-family: 'SWR-VAR-Sans';
				font-weight: 400 600 700;
				font-display: swap;
				src: url('https://www.swr.de/assets/fonts/swr_type/SWR_VAR_WEB/SWR-VAR-Sans.woff2')
					format('woff2');
			}

			@font-face {
				font-family: 'SWR-VAR-Text';
				font-weight: 400 600 700;
				font-display: swap;
				src: url('https://www.swr.de/assets/fonts/swr_type/SWR_VAR_WEB/SWR-VAR-Text.woff2')
					format('woff2');
			}
		</style>
	</head>
	<body>
		<div data-lab-components-embed="datawrapper-switcher"></div>
		<script type="module">
			import mountEmbed from '/src/lib/utils/mountEmbed';
			import Embed from '/src/components/datawrapper-switcher/embed.svelte';

			if (window.__mountDatawrapperSwitcher) {
				console.warn(
					'Datawrapper Switcher mount function already registered, skipping redefinition'
				);
			} else {
				window.__mountDatawrapperSwitcher = () => {
					const targets = document.querySelectorAll(
						'[data-lab-components-embed="datawrapper-switcher"]'
					);
					console.log('Mounting Datawrapper Switcher components on', targets);
					targets.forEach((t) => {
						console.log('Mounting individual Datawrapper Switcher on', t);
						mountEmbed(t, Embed);
					});
				};

				document.addEventListener('popstate', () => {
					console.log('Popstate event detected, remounting Datawrapper Switcher');
					window.__mountDatawrapperSwitcher();
				});
				console.log('Module loaded, mounting Datawrapper Switcher immediately');
				window.__mountDatawrapperSwitcher();
			}
		</script>
	</body>
</html>
